name: Verify calculator (unsigned)
on:
  push:
    branches:
      - remediation/calculator-clean-v1.0.1
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build unsigned release and run Android lint
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Validate unsigned APK identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          aik="$ANDROID_HOME/build-tools/34.0.0"
          if ! test -x "$aik/aapt"; then aik=$(dirname "$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"); fi
          "$aik/aapt" dump badging "$apk" > "$RUNNER_TEMP/calculator-badging.txt"
          grep -F "package: name='com.jameds.seniorcalculator.reissued' versionCode='101' versionName='1.0.1'" "$RUNNER_TEMP/calculator-badging.txt"
          grep -Fx "sdkVersion:'23'" "$RUNNER_TEMP/calculator-badging.txt"
          grep -F "name='com.jameds.seniorcalculator.MainActivity'" "$RUNNER_TEMP/calculator-badging.txt"
          "$aik/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/calculator-manifest.txt"
          grep -F 'E: queries ' "$RUNNER_TEMP/calculator-manifest.txt"
          grep -F '"android.intent.action.TTS_SERVICE"' "$RUNNER_TEMP/calculator-manifest.txt"
          "$aik/aapt" dump permissions "$apk" > "$RUNNER_TEMP/calculator-permissions.txt"
          if grep -E 'android\.permission\.(INTERNET|QUERY_ALL_PACKAGES)' "$RUNNER_TEMP/calculator-permissions.txt"; then exit 1; fi
          if "$aik/apksigner" verify "$apk" >/dev/null 2>&1; then echo 'Unexpected signed APK'; exit 1; fi
          sha256sum "$apk"
      - name: Retain checked unsigned APK for local signing
        if: github.event_name == 'push' && github.repository == 'cadence-jameds/senior-friendly-calculator' && github.ref == 'refs/heads/remediation/calculator-clean-v1.0.1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Senior-Calculator-v1.0.1-UNSIGNED
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
